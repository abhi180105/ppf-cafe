# Supabase CLI Configuration
# https://supabase.com/docs/guides/cli/config

[db]
  # Migration files directory
  migration_dir = "supabase/migrations"
  
  # Shadow database for testing migrations
  shadow_db = "postgresql://postgres:postgres@localhost:54322/postgres"

[api]
  # Port for the Supabase API (REST)
  port = 54321
  
  # Generate TypeScript types after migration
  generate_types = true

[studio]
  # Port for Supabase Studio
  port = 54323

[auth]
  # Local auth settings
  site_url = "http://localhost:5173"
  additional_redirect_urls = ["http://localhost:5173", "https://ppf-cafe.netlify.app"]

[edge-runtime]
  # Enable Edge Runtime for local development
  enabled = false

# Project-specific settings
project_id = "ppf-cafe"